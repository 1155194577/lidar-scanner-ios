name: LidarScanner
options:
  bundleIdPrefix: com.lidarscanner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  LidarScanner:
    type: application
    platform: iOS
    sources: [LidarScanner]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lidarscanner.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: LidarScanner/Info.plist
      properties:
        CFBundleDisplayName: LiDAR Scanner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: The camera and LiDAR sensor are used to capture 3D scans of rooms and objects.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  LidarScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LidarScannerTests]
    dependencies:
      - target: LidarScanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lidarscanner.app.tests
        GENERATE_INFOPLIST_FILE: YES
  LidarScannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LidarScannerUITests]
    dependencies:
      - target: LidarScanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lidarscanner.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LidarScanner
schemes:
  LidarScanner:
    build:
      targets:
        LidarScanner: all
    test:
      targets: [LidarScannerTests, LidarScannerUITests]
    archive:
      config: Release
