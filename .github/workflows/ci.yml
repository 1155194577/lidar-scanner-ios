name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and simulator
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -E 'Xcode_[0-9.]+\.app$' | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in runtimes if ".iOS-" in r), key=lambda r: [int(x) for x in r.split(".iOS-")[1].split("-")])
          for runtime in reversed(ios):
              for device in runtimes[runtime]:
                  if device["name"].startswith("iPhone") and device.get("isAvailable"):
                      print(device["udid"]); sys.exit()
          sys.exit("no iPhone simulator available")
          ')
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
      - name: Start print stub
        run: |
          python3 scripts/print_stub.py --host 127.0.0.1 --port 8765 --token stub-token > print_stub.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8765/health && break; sleep 0.5; done
      - name: Unit and UI tests
        run: |
          set -o pipefail
          xcodebuild test -project LidarScanner.xcodeproj -scheme LidarScanner \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath build | tail -n 60
      - name: Device build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project LidarScanner.xcodeproj -scheme LidarScanner \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO | tail -n 20
      - name: Print stub log
        if: always()
        run: cat print_stub.log || true
