name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Start print stub
        run: |
          python3 scripts/print_stub.py --host 127.0.0.1 --port 8765 > print_stub.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8765/health && break; sleep 0.5; done
      - name: Unit and UI tests
        run: |
          set -o pipefail
          xcodebuild test -project LidarScanner.xcodeproj -scheme LidarScanner \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath build | tail -n 60
      - name: Device build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project LidarScanner.xcodeproj -scheme LidarScanner \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO | tail -n 20
      - name: Print stub log
        if: always()
        run: cat print_stub.log || true
